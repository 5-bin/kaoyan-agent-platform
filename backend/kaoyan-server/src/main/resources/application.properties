server.address=${BIND_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/agent;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
agent.base-url=${AGENT_BASE_URL:http://127.0.0.1:8001}
agent.internal-key=${AGENT_INTERNAL_KEY:kaoyan-local-internal-key-2026}

agent.timeout-seconds=${AGENT_TIMEOUT_SECONDS:45}
agent.daily-task-limit=${DAILY_TASK_LIMIT:30}
agent.minute-task-limit=${MINUTE_TASK_LIMIT:6}

