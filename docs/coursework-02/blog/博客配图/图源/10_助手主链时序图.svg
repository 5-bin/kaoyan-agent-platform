<text x="445" y="1103" font-size="18" font-weight="400" text-anchor="start">16. 执行业务操作并保存</text>
<text x="45" y="1235" font-size="18" font-weight="400" text-anchor="start">练习标准答案和判分由 Java 处理；Agent 负责解释、建议与领域任务编排。</text></svg>