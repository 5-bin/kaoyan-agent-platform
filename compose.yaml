services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kaoyan_agent
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请填写DB_PASSWORD}
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d kaoyan_agent"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  agent:
    build: ./agent
    environment:
      AGENT_INTERNAL_KEY: ${AGENT_INTERNAL_KEY:?请填写AGENT_INTERNAL_KEY}
      AGENT_MODE: ${AGENT_MODE:-demo}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_API_KEY: ${MODEL_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-}
      MAX_MODEL_CALLS_PER_DAY: ${MAX_MODEL_CALLS_PER_DAY:-100}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      BIND_ADDRESS: 0.0.0.0
      DB_URL: jdbc:postgresql://database:5432/kaoyan_agent
      DB_USER: agent
      DB_PASSWORD: ${DB_PASSWORD:?请填写DB_PASSWORD}
      AGENT_BASE_URL: http://agent:8001
      AGENT_INTERNAL_KEY: ${AGENT_INTERNAL_KEY:?请填写AGENT_INTERNAL_KEY}
      DAILY_TASK_LIMIT: ${DAILY_TASK_LIMIT:-30}
      MINUTE_TASK_LIMIT: ${MINUTE_TASK_LIMIT:-6}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      database:
        condition: service_healthy
      agent:
        condition: service_healthy
    restart: unless-stopped
  gateway:
    image: caddy:2-alpine
    profiles: [public]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-http://localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [backend]
    restart: unless-stopped
volumes:
  database-data:
  caddy-data:
  caddy-config:
