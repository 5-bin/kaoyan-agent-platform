name: Platform checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: kaoyan-B/pom.xml
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            kaoyan-agent/requirements.txt
            kaoyan-agent/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: kaoyan-frontend/package-lock.json
      - name: Install isolated Python dependencies
        run: python -m pip install -r kaoyan-agent/requirements-dev.txt
      - name: Test workflows and persistent Qdrant (mock embeddings/models)
        working-directory: kaoyan-agent
        run: python -m pytest -q
      - name: Check current docs and contracts
        run: |
          python scripts/check-project.py
          python scripts/check-framework.py
      - name: Build Java and test the real Java to Python chain
        working-directory: kaoyan-B
        run: bash mvnw -B -ntp verify dependency:build-classpath -Dmdep.includeScope=test -Dmdep.outputFile=target/test-classpath.txt
      - name: Install and build frontend
        working-directory: kaoyan-frontend
        run: npm ci && npm run build
      - name: Check patches
        run: git diff --check
      - name: Browser checks with isolated mock API
        working-directory: kaoyan-frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Real HTTP and browser regression with isolated H2 and Redis/model doubles
        run: python scripts/smoke-current.py --output .cache/ci-merge-http.json --browser-check --node node
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-diagnostics
          path: |
            kaoyan-B/target/surefire-reports/
            kaoyan-B/target/agent-chain.log
            kaoyan-frontend/test-results/
            .cache/smoke-debug-*/
