name: Framework checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MAVEN_USER_HOME: ${{ github.workspace }}/.cache/maven
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r kaoyan-agent/requirements-dev.txt
      - name: Build backend and run isolated tests
        working-directory: kaoyan-B
        run: ./mvnw -B verify dependency:build-classpath -Dmdep.includeScope=test -Dmdep.outputFile=target/test-classpath.txt
      - name: Verify real Java to Python HTTP contract with isolated test services
        run: python scripts/smoke-current.py --output .cache/ci-smoke-current.json
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r kaoyan-agent/requirements-dev.txt
      - name: Agent contract tests without paid model or database
        working-directory: kaoyan-agent
        run: python -m pytest -q
      - run: python scripts/check-framework.py
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: kaoyan-frontend/package-lock.json
      - run: npm ci
        working-directory: kaoyan-frontend
      - run: npm run build
        working-directory: kaoyan-frontend
