name: Platform checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-path: .cache/maven/repository
          cache-dependency-path: kaoyan-B/pom.xml
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            kaoyan-agent/requirements.txt
            kaoyan-agent/requirements-dev.txt
            kaoyan-agent/langchain-constraints.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: kaoyan-frontend/package-lock.json
      - name: Install isolated Python dependencies
        run: python -m pip install -r kaoyan-agent/requirements-dev.txt
      - name: Test workflows and persistent Qdrant (mock embeddings/models)
        working-directory: kaoyan-agent
        run: python -m pytest -q
      - name: Check current docs and contracts
        run: |
          python scripts/check-project.py
          python scripts/check-framework.py
          python scripts/feature-test.py
          python -m unittest discover -s scripts/tests -v
      - name: Build Java and test the real Java to Python chain
        working-directory: kaoyan-B
        run: bash mvnw -B -ntp verify dependency:build-classpath -Dmdep.includeScope=test -Dmdep.outputFile=target/test-classpath.txt
      - name: Install and build frontend
        working-directory: kaoyan-frontend
        run: npm ci && npm run build
      - name: Check patches
        run: git diff --check
      - name: Browser checks with isolated mock API
        working-directory: kaoyan-frontend
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Real HTTP and browser regression with isolated H2 and Redis/model doubles
        run: python scripts/smoke-current.py --output .cache/ci-merge-http.json --browser-check --node node
      - name: Continuous chat and document browser chain with controlled SDK stream
        run: python scripts/smoke-chat.py --output .cache/ci-chat-http.json --node node
      - name: Learning assistant privacy and controlled actions with real Java and Python
        run: python scripts/smoke-chat.py --learning --output .cache/ci-learning-http.json --node node
      - name: Question admin with real Java and isolated H2
        run: python scripts/smoke-question-admin.py --output .cache/ci-question-admin-browser.json
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: test-diagnostics
          include-hidden-files: true
          path: |
            kaoyan-B/target/surefire-reports/
            kaoyan-B/target/agent-chain.log
            kaoyan-frontend/test-results/
            .cache/smoke-debug-*/
            .cache/chat-debug-*/
            .cache/chat-browser-*/
            .cache/learning-browser-*/
