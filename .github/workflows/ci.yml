name: Framework checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MAVEN_USER_HOME: ${{ github.workspace }}/.cache/maven
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: agent/requirements-dev.lock.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build Java and run tests
        working-directory: backend
        run: ./mvnw -B package
      - name: Install Python test dependencies
        run: python -m pip install -r agent/requirements-dev.lock.txt
      - name: Test Python with mock model
        working-directory: agent
        run: python -m pytest -q
      - name: Check frontend and test script syntax
        run: |
          node --input-type=module --check < frontend/app.js
          node --input-type=module --check < frontend/js/api.js
          node --check scripts/browser-check.cjs
      - name: Validate repository files
        run: python scripts/check-docs.py
      - name: Test real Java to Python chain in demo mode
        run: python scripts/smoke.py --output .cache/ci-smoke.json
